<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="icon.png" type="image/x-icon">
<title>Jet Refleks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<video id="videoEl" autoplay playsinline muted></video>
<audio id="bgMusic" loop preload="auto">
  <source src="bg.mp3" type="audio/mpeg">
</audio>
<canvas id="gameCanvas"></canvas>

<div id="score-box">
  <div id="score-label">PUAN</div>
  <div id="score-val">0</div>
</div>
<div id="combo-box">🔥 COMBO x<span id="combo-val">2</span></div>
<div id="lives-box">❤️❤️❤️</div>
<div id="status" class="loading">Yükleniyor</div>

<div id="start-screen">
  <div style="font-size:64px">🍎🍉🍓</div>
  <h1>MEYVE YAKALA!</h1>
  <p>Ellerinle havadaki meyveleri yakala.<br>Her meyve 10 puan — kaçırırsan can kaybedersin!</p>
  <button id="start-btn">▶ OYNA</button>
</div>

<div id="gameover-screen">
  <div style="font-size:64px">💀</div>
  <h2>GAME OVER</h2>
  <div id="final-score">Puan: 0</div>
  <button id="restart-btn">↺ Tekrar Oyna</button>
  <div id="auto-restart">5 saniyede otomatik başlıyor…</div>
  <div id="auto-bar-wrap"><div id="auto-bar"></div></div>
</div>

<div id="countdown"></div>

<div id="pause-screen">
  <div class="pause-icon">🙋</div>
  <h3>DURAKLATILDI</h3>
  <p>Kameraya gir veya birini çerçeveye al</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="game.js"></script>
</body>
</html>
